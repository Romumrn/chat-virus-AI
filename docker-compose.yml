services:
  # FastAPI backend + built React SPA (one origin). This is the app front-end;
  # the SQLite DB lives in ./auth_data (host bind-mount, persistent).
  #
  # The MCP data server is a SEPARATE service, in its own repo (viromeatlas_mcp).
  # It is not started here — run it independently (its own docker-compose, or a
  # deployed instance) and point MCP_SERVER_URL at it.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: virus-api
    environment:
      # URL of the external MCP server. Default assumes an MCP running on the
      # host (e.g. the viromeatlas_mcp compose on :8000); override for a
      # deployed instance. host.docker.internal resolves to the host from
      # inside the container.
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://host.docker.internal:8000/mcp}
      # Serve the SPA from the same origin, so CORS is inert; override if the
      # front is ever hosted separately.
      - CORS_ORIGINS=
    extra_hosts:
      # Make host.docker.internal work on Linux hosts too (it's automatic on
      # Docker Desktop / macOS).
      - "host.docker.internal:host-gateway"
    env_file:
      # ALBERT_API_KEY, JWT_SECRET, ADMIN_EMAILS, REGISTRATION_CODE.
      # JWT_SECRET MUST be a long random value in production — see .env.app.example.
      - .env.app
    volumes:
      - ./logs:/app/logs
      # Host bind-mount: the SQLite DB lives at ./auth_data/viromechat.db so it
      # can be backed up without going through the container. The directory is
      # tracked in git (auth_data/.gitkeep) so it exists before the first "up".
      - ./auth_data:/app/auth_data
    ports:
      - "8080:8080"
    restart: unless-stopped
